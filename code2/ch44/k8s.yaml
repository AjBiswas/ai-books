# Book 1, Chapter 44: run a vLLM model server on Kubernetes with a GPU, a health probe and autoscaling.
# Not applied on the author's laptop (no cluster there). On a cluster with NVIDIA GPUs:
#   kubectl apply -f k8s.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-server
spec:
  replicas: 1
  selector:
    matchLabels: { app: llm-server }
  template:
    metadata:
      labels: { app: llm-server }
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest          # pin an exact version in production
          args: ["--model", "Qwen/Qwen3-8B", "--max-model-len", "8192", "--gpu-memory-utilization", "0.90"]
          ports: [{ containerPort: 8000 }]
          resources:
            limits: { nvidia.com/gpu: 1, memory: "32Gi" }   # one GPU per pod
          readinessProbe:                          # no traffic until the model has loaded
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-server
spec:
  selector: { app: llm-server }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-server
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: llm-server }
  minReplicas: 1
  maxReplicas: 4                                   # every extra replica is another GPU on the bill
  metrics:   # CPU is a simple stand-in; real LLM servers scale on queue length (e.g. vLLM's waiting requests) via custom metrics
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
